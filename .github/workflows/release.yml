# 发布流水线:推 v* 标签后自动校验版本号一致性,构建 macOS(Apple Silicon/Intel)、
# Windows 与 Linux 四份产物,发布到 GitHub Release,并同步附件到 Gitee Release。
#
# 产物命名契约(与后端更新引擎锁定,纯 ASCII——GitHub 会剥离附件名中的非 ASCII
# 字符,且是存储层行为,事后 PATCH 改回中文名也无效;中文前缀由 Gitee 同步脚本
# scripts/sync-gitee-release.sh 上传时改回):
#   ShengShouYunHe-<tag>-darwin-arm64.zip    (zip 内是 圣手运河.app)
#   ShengShouYunHe-<tag>-darwin-amd64.zip    (zip 内是 圣手运河.app)
#   ShengShouYunHe-<tag>-windows-amd64.zip   (zip 内是 圣手运河.exe)
#   ShengShouYunHe-<tag>-linux-amd64.tar.gz  (tar 内是 圣手运河 ELF 二进制)
#   SHA256SUMS.txt(每行 <os>-<arch>: <64位hex>,固定四个平台键、固定顺序)
#   可选:ShengShouYunHe-<tag>-windows-amd64-installer.exe(NSIS,缺失不影响发布)
#
# 前提(一次性配置):
# 1. origin 已配置双推送地址(Gitee + GitHub 镜像),`git push origin main --tags`
#    会同时推两侧;本工作流跑在 GitHub Actions 上,推完可用
#    `git ls-remote https://github.com/cherish-zp/sheng-shou-yun-he.git refs/tags/<tag>`
#    确认 tag 已到达 GitHub 侧(Gitee Go 无 macOS 构建机,故用 GitHub Actions)。
# 2. GitHub 仓库 Settings → Secrets and variables → Actions 配置 GITEE_TOKEN
#    (Gitee 私人令牌,具备 projects 权限),产物才会同步回 Gitee Release。
# 3. Gitee 同步是 best-effort;失败时的手动重跑入口:.github/workflows/sync-gitee.yml
#    (workflow_dispatch,不重新构建)。
name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  # ---------- 版本号一致性校验:wails.json 的 info.productVersion 与顶层
  # productVersion、frontend/package.json 的 version、frontend/src/version.ts 的
  # APP_VERSION,四处值必须完全一致;不一致直接 fail 并打印实际值 ----------
  check-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version consistency
        run: |
          python3 - <<'PY'
          import json
          import re
          import sys

          def fail(msg):
              print("::error::" + msg)
              sys.exit(1)

          with open("wails.json", encoding="utf-8") as f:
              wails = json.load(f)
          with open("frontend/package.json", encoding="utf-8") as f:
              pkg = json.load(f)
          with open("frontend/src/version.ts", encoding="utf-8") as f:
              m = re.search(r"APP_VERSION\s*=\s*['\"]([^'\"]+)['\"]", f.read())

          versions = {
              "wails.json info.productVersion": wails.get("info", {}).get("productVersion", ""),
              "wails.json productVersion": wails.get("productVersion", ""),
              "frontend/package.json version": pkg.get("version", ""),
              "frontend/src/version.ts APP_VERSION": m.group(1) if m else "",
          }
          missing = [k for k, v in versions.items() if not v]
          if missing:
              fail("版本号提取失败:" + ", ".join(missing))
          if len(set(versions.values())) != 1:
              print("::error::版本号不一致,打 tag 前请把以下三处改成同一个值:")
              for k, v in versions.items():
                  print("  - " + k + " = " + str(v))
              sys.exit(1)
          print("版本号一致:" + next(iter(versions.values())))
          PY

  # ---------- 四平台构建矩阵(全部依赖 check-versions)----------
  build-darwin-arm64:
    needs: check-versions
    runs-on: macos-14 # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build arm64
        run: wails build --platform darwin/arm64

      - name: Package arm64
        run: |
          cd build/bin
          zip -qr "${{ github.workspace }}/ShengShouYunHe-${{ github.ref_name }}-darwin-arm64.zip" 圣手运河.app

      - uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64
          path: ShengShouYunHe-*-darwin-arm64.zip
          if-no-files-found: error

  build-darwin-amd64:
    needs: check-versions
    runs-on: macos-14 # macos-14 是 Apple Silicon 机器,交叉编译 Intel 版
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build amd64
        run: wails build --platform darwin/amd64

      - name: Package amd64
        run: |
          cd build/bin
          zip -qr "${{ github.workspace }}/ShengShouYunHe-${{ github.ref_name }}-darwin-amd64.zip" 圣手运河.app

      - uses: actions/upload-artifact@v4
        with:
          name: darwin-amd64
          path: ShengShouYunHe-*-darwin-amd64.zip
          if-no-files-found: error

  build-windows-amd64:
    needs: check-versions
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build exe
        run: wails build --platform windows/amd64

      - name: Package exe
        run: Compress-Archive -Path build/bin/圣手运河.exe -DestinationPath "ShengShouYunHe-${{ github.ref_name }}-windows-amd64.zip"

      # build/windows/installer 已有 NSIS 工程;NSIS 未进 runner 时跳过,不影响 zip 产物。
      - name: Build NSIS installer (optional)
        continue-on-error: true
        run: wails build --platform windows/amd64 -nsis

      - name: Package installer (optional)
        if: hashFiles('build/bin/*-amd64-installer.exe') != ''
        run: Copy-Item build/bin/*-amd64-installer.exe "ShengShouYunHe-${{ github.ref_name }}-windows-amd64-installer.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: |
            ShengShouYunHe-*-windows-amd64.zip
            ShengShouYunHe-*-windows-amd64-installer.exe
          if-no-files-found: error

  build-linux-amd64:
    needs: check-versions
    # 必须是 22.04:Wails v2 依赖 webkit2gtk-4.0,24.04 只有 4.1。
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build linux binary
        run: wails build --platform linux/amd64

      - name: Package linux binary
        run: tar -czf "ShengShouYunHe-${{ github.ref_name }}-linux-amd64.tar.gz" -C build/bin 圣手运河

      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: ShengShouYunHe-*-linux-amd64.tar.gz
          if-no-files-found: error

  # ---------- 发布:汇总四平台产物,生成 SHA256SUMS.txt 与发布说明,发布 GitHub
  # Release 后 best-effort 同步 Gitee ----------
  release:
    needs: [ build-darwin-arm64, build-darwin-amd64, build-windows-amd64, build-linux-amd64 ]
    runs-on: ubuntu-latest
    steps:
      # checkout 是为了读 annotated tag 注释(git tag -l --format)与同步脚本本身。
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Generate SHA256SUMS.txt
        run: |
          TAG="${GITHUB_REF_NAME}"
          # 契约格式:每行 <os>-<arch>: <64位hex>,固定四个平台键、固定顺序。
          # 产物文件名由上游构建 job 契约决定,这里按名精确查找,缺任一平台直接 fail。
          : > dist/SHA256SUMS.txt
          for key in darwin-arm64 darwin-amd64 windows-amd64 linux-amd64; do
            if [ "${key}" = "linux-amd64" ]; then ext=tar.gz; else ext=zip; fi
            f="dist/ShengShouYunHe-${TAG}-${key}.${ext}"
            if [ ! -f "${f}" ]; then
              echo "::error::缺少平台产物 ${f},无法生成 SHA256SUMS.txt"
              exit 1
            fi
            printf '%s: %s\n' "${key}" "$(sha256sum "${f}" | awk '{print $1}')" >> dist/SHA256SUMS.txt
          done
          cat dist/SHA256SUMS.txt

      - name: Build release body
        run: |
          TAG="${GITHUB_REF_NAME}"
          # 发布说明取 annotated tag 的注释(版本要点 + 发布人署名);本 job 已
          # checkout 该 tag,直接读本地 tag 对象;取不到回退默认文案。
          NOTES="$(git tag -l --format='%(contents)' "${TAG}")"
          if [ -z "$(printf '%s' "${NOTES}" | tr -d '[:space:]')" ]; then
            NOTES="自动构建产物:macOS(Apple Silicon / Intel)、Windows 与 Linux 安装包。"
          fi
          # Gitee Release 的 body 与此组装方式保持一致(见 scripts/sync-gitee-release.sh)。
          {
            printf '%s\n' "${NOTES}"
            printf '\n```sha256sums\n'
            cat dist/SHA256SUMS.txt
            printf '```\n'
          } > release_body.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release_body.md
          generate_release_notes: true

      # 同步附件到 Gitee Release:Release 已存在则复用(PATCH body 保持同步),否则创建;
      # 附件改名 ShengShouYunHe → 圣手运河,幂等(同名跳过)。权威逻辑在
      # scripts/sync-gitee-release.sh,与本机手动同步共用同一脚本。
      # best-effort:GitHub 构建机到 gitee.com 可能慢/不通,失败不阻塞发布,
      # 可用 sync-gitee.yml 或本机脚本按原 tag 重跑。
      - name: Sync to Gitee Release
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: bash scripts/sync-gitee-release.sh "$TAG"
